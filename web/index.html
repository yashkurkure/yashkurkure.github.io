<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Yash's Portfolio">

  <!-- Link previews (LinkedIn, Slack, iMessage, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yashkurkure.github.io/">
  <meta property="og:title" content="Yash Kurkure">
  <meta property="og:description" content="Software engineer. Projects, experience, and contact.">
  <!-- <meta property="og:image" content="https://yashkurkure.github.io/og-image.png"> add once you have a 1200x630 image in web/ -->
  <meta name="twitter:card" content="summary_large_image">

  <meta name="theme-color" content="#3F51B5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yash Kurkure">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Yash's Portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
